name: Update Repository Summary

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  update-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        id: secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CONFLUENCE_USER_EMAIL: op://Engineering/docs-automation-secrets/confluence_user_email
          CONFLUENCE_API_TOKEN: op://Engineering/docs-automation-secrets/confluence_api_token
          ANTHROPIC_API_KEY: op://Engineering/gh-doc-anthropic-key/credential
          CLOUDFLARE_API_TOKEN: op://Engineering/vonsgrysumlyksoqdejqgyij4m/credential
          CLOUDFLARE_ACCOUNT_ID: op://Engineering/nm7yhfxvxoyxtzhyy5it534rbe/account_id
          R2_ACCESS_KEY_ID: op://Engineering/cqjy5aqoucsbmjcdychmwq43wy/username
          R2_SECRET_ACCESS_KEY: op://Engineering/cqjy5aqoucsbmjcdychmwq43wy/password

      - name: Generate and publish summary
        uses: dtlr/The-Docsening/.github/actions/generate-summary@main
        with:
          confluence-user-email: ${{ steps.secrets.outputs.CONFLUENCE_USER_EMAIL }}
          confluence-api-token: ${{ steps.secrets.outputs.CONFLUENCE_API_TOKEN }}
          anthropic-api-key: ${{ steps.secrets.outputs.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cloudflare-api-token: ${{ steps.secrets.outputs.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ steps.secrets.outputs.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ steps.secrets.outputs.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ steps.secrets.outputs.R2_SECRET_ACCESS_KEY }}